services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: modbud_backend
    ports:
      - "8000:8000"   # HTTP API
      - "1502:1502"   # Modbus TCP (нестандартный порт для запуска без root)
    volumes:
      - sim_data:/data
    environment:
      - MODBUS_PORT=1502
      - API_PORT=8000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: modbud_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: modbud_frontend_test
    profiles:
      - testing
    command: npm test -- --run

volumes:
  sim_data:
    driver: local

